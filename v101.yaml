# The DAC Output select needs to be manually (or with an automation) changed to `LINE1` for the onboard speaker
select:
  - platform: es8388
    dac_output:
      name: DAC Output
      id: es8388_dac_output
    adc_input_mic:
      name: ADC Input Mic

  - platform: template
    id: wifi_antenna_select
    name: "WiFi Antenna"
    options:
      - "Internal"
      - "External"
    optimistic: true
    on_value:
      - if:
          condition:
            lambda: return i == 0;
          then:
            - switch.turn_off: wifi_antenna_int_ext
          else:
            - switch.turn_on: wifi_antenna_int_ext

  - platform: template
    name: "Wake word sensitivity"
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      lambda: |-
        if (x == "Slightly sensitive") {
          id(hey_jarvis).set_probability_cutoff(247);
        } else if (x == "Moderately sensitive") {
          id(hey_jarvis).set_probability_cutoff(235);
        } else if (x == "Very sensitive") {
          id(hey_jarvis).set_probability_cutoff(212);
        }


i2s_audio:
  - id: mic_bus
    i2s_lrclk_pin: GPIO29
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO30

audio_adc:
  - platform: es7210
    id: es7210_adc
    bits_per_sample: 16bit
    sample_rate: 16000

microphone:
  - platform: i2s_audio
    id: tab5_microphone
    i2s_audio_id: mic_bus
    i2s_din_pin: GPIO28
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external

audio_dac:
  - platform: es8388
    id: es8388_dac

speaker:
  - platform: i2s_audio
    id: tab5_speaker
    i2s_audio_id: mic_bus
    i2s_dout_pin: GPIO26
    audio_dac: es8388_dac
    dac_type: external
    channel: mono
    buffer_duration: 100ms
    timeout: 300ms
    bits_per_sample: 16bit
    sample_rate: 48000

media_player:
  - platform: speaker
    name: None
    id: external_media_player
    internal: false
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 0.85
    announcement_pipeline:
      speaker: tab5_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1

    # Preserve the original working I2S handoff: stop wake-word capture
    # before an announcement attempts to acquire the shared speaker bus.
    on_announcement:
      - lambda: |-
          id(jarvis_audio_freeze) = true;
      - script.execute:
          id: jarvis_set_mode
          mode: 2
      - light.turn_on:
          id: backlight
      - micro_wake_word.stop:
      - microphone.stop_capture:
          id: tab5_microphone

    # Once playback is idle, return to the selected idle profile when Voice
    # Assistant itself is no longer active.
    on_idle:
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - script.execute: jarvis_return_to_idle

    files:
      - id: wake_word_triggered_sound
        file: https://www.myinstants.com/media/sounds/sound-3_ARju4wR.mp3

micro_wake_word:
  id: mww
  stop_after_detection: true
  microphone:
    microphone: tab5_microphone
  models:
    - model: hey_jarvis
      id: hey_jarvis
  vad:
  on_wake_word_detected:
    - light.turn_on:
        id: backlight
        transition_length: 15s
    - lambda: |-
        id(jarvis_audio_freeze) = true;
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: tab5_microphone
  media_player: external_media_player
  micro_wake_word: mww

  on_listening:
    - lambda: |-
        id(jarvis_audio_freeze) = true;
    - script.execute:
        id: jarvis_set_mode
        mode: 1

  on_stt_vad_end:
    - lambda: |-
        // Keep the static listening display while the final microphone data
        // is being delivered. Thinking begins only after on_stt_end.
        id(jarvis_audio_freeze) = true;

  on_stt_end:
    - microphone.stop_capture:
        id: tab5_microphone
    - script.execute:
        id: jarvis_set_mode
        mode: 3
    # The microphone stream has ended, so allow only the lightweight
    # three-arc thinking animation while Home Assistant processes the request.
    - lambda: |-
        id(jarvis_audio_freeze) = false;

  on_tts_start:
    - lambda: |-
        id(jarvis_audio_freeze) = true;
    - script.execute:
        id: jarvis_set_mode
        mode: 2

  # Keep the static speaking display until media_player.on_idle or on_end
  # confirms that speaker playback has actually finished.
  on_error:
    - lambda: |-
        id(jarvis_audio_freeze) = true;
    - script.execute:
        id: jarvis_set_mode
        mode: 4
    - delay: 2s
    - script.execute: jarvis_return_to_idle

  # Preserve the original release sequence. Wait for any announcement to
  # start, then wait for both media playback and the speaker to finish before
  # re-enabling wake-word capture on the shared I2S bus.
  on_end:
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                speaker.is_playing:
    - script.execute: jarvis_return_to_idle

  on_client_connected:
    - wait_until:
        condition:
          lambda: |-
            return id(jarvis_visuals_ready);
        timeout: 5s
    - delay: 500ms
    - script.execute: refresh_idle_profile_ui
    - if:
        condition:
          lambda: 'return id(voice_wake_enabled);'
        then:
          - micro_wake_word.start:
        else:
          - micro_wake_word.stop:
          - lambda: |-
              id(jarvis_audio_freeze) = false;

  on_client_disconnected:
    - micro_wake_word.stop:
    - lambda: |-
        id(jarvis_audio_freeze) = false;

script:
  # Reuse panel 04 for health stats outside the requested ORCL market window.
  # Market mode is weekdays 14:30-21:00 using Home Assistant local time.
  - id: refresh_oracle_health_panel
    mode: restart
    then:
      - lambda: |-
          auto now = id(time_comp).now();
          if (!now.is_valid()) return;

          // ESPHome day_of_week: 1=SUN, 2=MON ... 7=SAT.
          const bool weekday = now.day_of_week >= 2 && now.day_of_week <= 6;
          const int minutes_now = now.hour * 60 + now.minute;
          const bool market_window = weekday && minutes_now >= (14 * 60 + 30) &&
                                     minutes_now < (21 * 60);

          auto set_visible = [](lv_obj_t *obj, bool visible) {
            if (visible) lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
          };

          set_visible(id(oracle_title_label), market_window);
          set_visible(id(oracle_price_label), market_window);
          set_visible(id(health_sleep_img), !market_window);
          set_visible(id(health_sleep_value), !market_window);
          set_visible(id(health_energy_img), !market_window);
          set_visible(id(health_energy_value), !market_window);
          set_visible(id(health_steps_img), !market_window);
          set_visible(id(health_steps_value), !market_window);

          if (market_window) return;

          // Sleep duration is displayed exactly as provided by the formatted
          // HA sensor. Parse common "8h 15m", "8:15", or decimal-hour forms
          // only for the colour threshold.
          const std::string sleep_text = id(sleep_duration_formatted).state;
          float sleep_hours = NAN;
          if (!sleep_text.empty() && sleep_text != "unknown" &&
              sleep_text != "unavailable") {
            const size_t hpos = sleep_text.find('h');
            const size_t colon = sleep_text.find(':');
            if (hpos != std::string::npos) {
              sleep_hours = strtof(sleep_text.c_str(), nullptr);
              const char *mins_start = sleep_text.c_str() + hpos + 1;
              while (*mins_start == ' ') mins_start++;
              char *mins_end = nullptr;
              const float mins = strtof(mins_start, &mins_end);
              if (mins_end != mins_start) sleep_hours += mins / 60.0f;
            } else if (colon != std::string::npos) {
              int hours = 0;
              int mins = 0;
              if (sscanf(sleep_text.c_str(), "%d:%d", &hours, &mins) == 2) {
                sleep_hours = (float)hours + ((float)mins / 60.0f);
              }
            } else {
              char *end = nullptr;
              const float parsed = strtof(sleep_text.c_str(), &end);
              if (end != sleep_text.c_str()) sleep_hours = parsed;
            }
          }

          const lv_color_t grey = lv_color_hex(0xA6A6A6);
          const lv_color_t green_c = lv_color_hex(0x78F543);
          const lv_color_t orange_c = lv_color_hex(0xFF6600);
          const lv_color_t red_c = lv_color_hex(0xFF0000);

          lv_color_t sleep_colour = grey;
          if (!isnan(sleep_hours)) {
            if (sleep_hours > 8.0f) sleep_colour = green_c;
            else if (sleep_hours > 7.0f) sleep_colour = orange_c;
            else sleep_colour = red_c;
          }
          lv_label_set_text(id(health_sleep_value),
                            (sleep_text.empty() || sleep_text == "unknown" ||
                             sleep_text == "unavailable") ? "--" : sleep_text.c_str());
          lv_obj_set_style_text_color(id(health_sleep_value), sleep_colour, LV_PART_MAIN);
          lv_obj_set_style_img_recolor(id(health_sleep_img), sleep_colour, LV_PART_MAIN);
          lv_obj_set_style_img_recolor_opa(id(health_sleep_img), LV_OPA_80, LV_PART_MAIN);

          const float energy = id(health_energy).state;
          lv_color_t energy_colour = grey;
          char energy_buf[16];
          if (isnan(energy)) {
            snprintf(energy_buf, sizeof(energy_buf), "--");
          } else {
            snprintf(energy_buf, sizeof(energy_buf), "%d", (int)lroundf(energy));
            if (energy > 80.0f) energy_colour = green_c;
            else if (energy > 70.0f) energy_colour = orange_c;
            else energy_colour = red_c;
          }
          lv_label_set_text(id(health_energy_value), energy_buf);
          lv_obj_set_style_text_color(id(health_energy_value), energy_colour, LV_PART_MAIN);
          lv_obj_set_style_img_recolor(id(health_energy_img), energy_colour, LV_PART_MAIN);
          lv_obj_set_style_img_recolor_opa(id(health_energy_img), LV_OPA_80, LV_PART_MAIN);

          const float steps = id(health_steps).state;
          lv_color_t steps_colour = grey;
          char steps_buf[16];
          if (isnan(steps)) {
            snprintf(steps_buf, sizeof(steps_buf), "--");
          } else {
            snprintf(steps_buf, sizeof(steps_buf), "%d", (int)lroundf(steps));
            if (steps > 1000.0f) steps_colour = green_c;
            else if (steps > 800.0f) steps_colour = orange_c;
            else steps_colour = red_c;
          }
          lv_label_set_text(id(health_steps_value), steps_buf);
          lv_obj_set_style_text_color(id(health_steps_value), steps_colour, LV_PART_MAIN);
          lv_obj_set_style_img_recolor(id(health_steps_img), steps_colour, LV_PART_MAIN);
          lv_obj_set_style_img_recolor_opa(id(health_steps_img), LV_OPA_80, LV_PART_MAIN);

  # Coalesce bursts of Home Assistant state changes into one LVGL pass.
  # mode: restart means several updates arriving within 150 ms result in a
  # single refresh using the newest states. The short quiet window prevents
  # periodic animation from competing with that redraw.
  - id: refresh_ha_widgets
    mode: restart
    then:
      - lambda: |-
          id(ui_quiet_until) = millis() + 380UL;
      - delay: 150ms
      - lambda: |-
          auto esp_to_lv = [](esphome::Color c) {
            return lv_color_make(c.r, c.g, c.b);
          };
          auto temp_color = [](float value) -> lv_color_t {
            if (value <= 5.0f) return lv_color_hex(0x3498DB);
            if (value <= 16.0f) return lv_color_hex(0x70A03C);
            if (value <= 19.0f) return lv_color_hex(0xFF9800);
            return lv_color_hex(0xE74C3C);
          };

          // Weather condition/icon.
          static std::string last_condition = "\x01";
          const std::string condition = id(conditionswd).state;
          if (condition != last_condition) {
            const char *icon = "\U000F0590";
            if (condition == "clear-night") icon = "\U000F0594";
            else if (condition == "cloudy") icon = "\U000F0590";
            else if (condition == "fog") icon = "\U000F0591";
            else if (condition == "hail" || condition == "sleet") icon = "\U000F067F";
            else if (condition == "lightning" || condition == "lightning-rainy") icon = "\U000F0593";
            else if (condition == "partlycloudy") icon = "\U000F0595";
            else if (condition == "pouring" || condition == "rainy") icon = "\U000F0596";
            else if (condition == "snowy" || condition == "snowy-rainy") icon = "\U000F0F36";
            else if (condition == "sunny") icon = "\U000F0599";
            else if (condition == "windy" || condition == "exceptional") icon = "\U000F0F30";
            lv_label_set_text(id(weather_icon_label), icon);
            lv_obj_set_style_text_color(id(weather_icon_label), esp_to_lv(id(cyan)), LV_PART_MAIN);
            last_condition = condition;
          }

          // Shopping list: build at most five one-line items, and only redraw
          // the multiline label when the resulting display text changed.
          static std::string last_shopping = "\x01";
          const std::string source = id(shopping).state;
          std::string shopping_output;
          shopping_output.reserve(source.size() + 8);
          size_t start = 0;
          int line_count = 0;
          while (start <= source.size() && line_count < 5) {
            size_t end = source.find(',', start);
            if (end == std::string::npos) end = source.size();
            size_t first = start;
            while (first < end && source[first] == ' ') first++;
            size_t last = end;
            while (last > first && source[last - 1] == ' ') last--;
            if (last > first) {
              if (!shopping_output.empty()) shopping_output += "\n";
              shopping_output.append(source, first, last - first);
              line_count++;
            }
            if (end == source.size()) break;
            start = end + 1;
          }
          if (shopping_output != last_shopping) {
            lv_label_set_text(id(shopping_list), shopping_output.c_str());
            last_shopping = shopping_output;
          }

          // Heating and hot-water state are shown only by icon colour.
          static std::string last_climate_action = "\x01";
          const std::string climate = id(climate_action).state;
          if (climate != last_climate_action) {
            if (climate == "heating") {
              lv_obj_set_style_img_recolor_opa(id(hive_img), LV_OPA_70, LV_PART_MAIN);
              lv_obj_set_style_img_recolor(id(hive_img), esp_to_lv(id(orange)), LV_PART_MAIN);
            } else if (climate == "idle") {
              lv_obj_set_style_img_recolor_opa(id(hive_img), LV_OPA_70, LV_PART_MAIN);
              lv_obj_set_style_img_recolor(id(hive_img), esp_to_lv(id(green)), LV_PART_MAIN);
            } else {
              lv_obj_set_style_img_recolor_opa(id(hive_img), LV_OPA_TRANSP, LV_PART_MAIN);
            }
            last_climate_action = climate;
          }

          static std::string last_boiler = "\x01";
          const std::string boiler = id(water_boiler_operation_mode).state;
          const int boiler_active = boiler == "on" ? 1 : 0;
          if (boiler != last_boiler) {
            if (boiler_active) {
              lv_obj_clear_flag(id(boiler_img), LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_style_img_recolor_opa(id(boiler_img), LV_OPA_70, LV_PART_MAIN);
              lv_obj_set_style_img_recolor(id(boiler_img), esp_to_lv(id(orange)), LV_PART_MAIN);
            } else {
              lv_obj_add_flag(id(boiler_img), LV_OBJ_FLAG_HIDDEN);
            }
            last_boiler = boiler;
          }

          // Broadband download meter. Ten segments cover 0-40 Mbit/s
          // in 4 Mbit/s steps. The speedometer and all filled segments use
          // the same threshold colour as the existing Mushroom card:
          // <=10 red, >10-25 yellow, >25-32 orange, >32 green.
          static int last_broadband_bars = -1;
          static int last_broadband_band = -2;
          const float broadband = id(speedtest_download).state;
          const bool broadband_valid = !isnan(broadband);
          int broadband_bars = 0;
          int broadband_band = -1;
          if (broadband_valid) {
            float speed = broadband;
            if (speed < 0.0f) speed = 0.0f;
            broadband_bars = (int) ceilf(speed / 4.0f);
            if (broadband_bars > 10) broadband_bars = 10;
            if (broadband_bars < 0) broadband_bars = 0;
            if (speed > 32.0f) broadband_band = 3;
            else if (speed > 25.0f) broadband_band = 2;
            else if (speed > 10.0f) broadband_band = 1;
            else broadband_band = 0;
          }
          if (broadband_bars != last_broadband_bars ||
              broadband_band != last_broadband_band) {
            lv_obj_t *broadband_segments[] = {
              id(broadband_bar_1), id(broadband_bar_2), id(broadband_bar_3),
              id(broadband_bar_4), id(broadband_bar_5), id(broadband_bar_6),
              id(broadband_bar_7), id(broadband_bar_8), id(broadband_bar_9),
              id(broadband_bar_10)
            };
            if (!broadband_valid) {
              lv_obj_add_flag(id(broadband_speedometer_img), LV_OBJ_FLAG_HIDDEN);
              for (int i = 0; i < 10; i++) {
                lv_obj_add_flag(broadband_segments[i], LV_OBJ_FLAG_HIDDEN);
              }
            } else {
              lv_obj_clear_flag(id(broadband_speedometer_img), LV_OBJ_FLAG_HIDDEN);
              for (int i = 0; i < 10; i++) {
                lv_obj_clear_flag(broadband_segments[i], LV_OBJ_FLAG_HIDDEN);
              }
              const lv_color_t broadband_colors[] = {
                lv_color_hex(0xF04D4D),  // red
                lv_color_hex(0xD8E34A),  // yellow
                lv_color_hex(0xFF9F32),  // orange
                lv_color_hex(0x43D17A)   // green
              };
              const lv_color_t status_color = broadband_colors[broadband_band];
              lv_obj_set_style_img_recolor(id(broadband_speedometer_img), status_color, LV_PART_MAIN);
              lv_obj_set_style_img_recolor_opa(id(broadband_speedometer_img), LV_OPA_80, LV_PART_MAIN);
              for (int i = 0; i < 10; i++) {
                if (i < broadband_bars) {
                  lv_obj_set_style_bg_color(broadband_segments[i], status_color, LV_PART_MAIN);
                  lv_obj_set_style_bg_opa(broadband_segments[i], LV_OPA_COVER, LV_PART_MAIN);
                  lv_obj_set_style_shadow_color(broadband_segments[i], status_color, LV_PART_MAIN);
                  lv_obj_set_style_shadow_opa(broadband_segments[i], 90, LV_PART_MAIN);
                } else {
                  lv_obj_set_style_bg_color(broadband_segments[i], lv_color_hex(0x17343A), LV_PART_MAIN);
                  lv_obj_set_style_bg_opa(broadband_segments[i], 115, LV_PART_MAIN);
                  lv_obj_set_style_shadow_opa(broadband_segments[i], LV_OPA_TRANSP, LV_PART_MAIN);
                }
              }
            }
            last_broadband_bars = broadband_bars;
            last_broadband_band = broadband_band;
          }

          // Appliance/door visibility and dynamic left-packed layout.
          auto set_visible = [](lv_obj_t *obj, bool visible) {
            if (visible) lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
          };
          static int last_dishwasher = -1;
          static int last_washing = -1;
          static int last_kettle = -1;
          static int last_door = -1;
          static int last_empty = -1;
          static int last_appliance_mask = -1;
          const int dishwasher = id(dishwasher_status).state == "Running" ? 1 : 0;
          const int washing = id(washing_machine_status).state == "run" ? 1 : 0;
          const int kettle = id(kettle_status).state == "heating" ? 1 : 0;
          const int door = id(front_door).state == "on" ? 1 : 0;
          const int empty = id(wm_needs_emptying).state ? 1 : 0;
          const int washer_group = (washing || empty) ? 1 : 0;
          if (dishwasher != last_dishwasher) {
            set_visible(id(dishwasher_img), dishwasher);
            if (dishwasher) {
              lv_obj_set_style_img_recolor_opa(id(dishwasher_img), LV_OPA_70, LV_PART_MAIN);
              lv_obj_set_style_img_recolor(id(dishwasher_img), esp_to_lv(id(cyan)), LV_PART_MAIN);
            }
            last_dishwasher = dishwasher;
          }
          if (washing != last_washing) {
            set_visible(id(washing_machine_img), washing);
            if (washing) {
              lv_obj_set_style_img_recolor_opa(id(washing_machine_img), LV_OPA_70, LV_PART_MAIN);
              lv_obj_set_style_img_recolor(id(washing_machine_img), esp_to_lv(id(cyan)), LV_PART_MAIN);
            }
            last_washing = washing;
          }
          if (kettle != last_kettle) {
            set_visible(id(kettle_img), kettle);
            if (kettle) {
              lv_obj_set_style_img_recolor_opa(id(kettle_img), LV_OPA_70, LV_PART_MAIN);
              lv_obj_set_style_img_recolor(id(kettle_img), esp_to_lv(id(cyan)), LV_PART_MAIN);
            }
            last_kettle = kettle;
          }
          if (door != last_door) {
            set_visible(id(front_door_img), door);
            if (door) {
              lv_obj_set_style_img_recolor_opa(id(front_door_img), LV_OPA_70, LV_PART_MAIN);
              lv_obj_set_style_img_recolor(id(front_door_img), esp_to_lv(id(cyan)), LV_PART_MAIN);
            }
            last_door = door;
          }
          if (empty != last_empty) {
            set_visible(id(wm_empty_icon), empty);
            if (empty) {
              lv_obj_set_style_img_recolor_opa(id(wm_empty_icon), LV_OPA_70, LV_PART_MAIN);
              lv_obj_set_style_img_recolor(id(wm_empty_icon), esp_to_lv(id(orange)), LV_PART_MAIN);
            }
            last_empty = empty;
          }

          // Pack the complete top row from the left. 38 px icons plus a 4 px
          // gap allow the worst case (Hive + Boiler + four appliances + timer)
          // to remain comfortably inside the widened 348 px inner panel. Hive is always first.
          const int appliance_mask = kettle | (door << 1) | (dishwasher << 2) |
                                     (washer_group << 3) | (boiler_active << 4);
          if (appliance_mask != last_appliance_mask) {
            int appliance_x = 24;
            const int appliance_step = 42;
            auto pack_icon = [&appliance_x, appliance_step](lv_obj_t *obj, bool active) {
              if (!active) return;
              lv_obj_set_x(obj, appliance_x);
              appliance_x += appliance_step;
            };
            pack_icon(id(hive_img), true);
            pack_icon(id(boiler_img), boiler_active);
            pack_icon(id(kettle_img), kettle);
            pack_icon(id(front_door_img), door);
            pack_icon(id(dishwasher_img), dishwasher);
            if (washer_group) {
              lv_obj_set_x(id(washing_machine_img), appliance_x);
              lv_obj_set_x(id(wm_empty_icon), appliance_x);
              lv_obj_set_x(id(wm_minutes_label), appliance_x + appliance_step);
            }
            last_appliance_mask = appliance_mask;
          }

          // Person location icons. Optional sensor.<name>_zone_icon helpers can
          // pass through each HA zone's configured mdi: icon. A zone-name
          // keyword fallback keeps the card useful even without those helpers.
          auto lower_person_text = [](std::string value) {
            for (char &c : value) {
              if (c >= 'A' && c <= 'Z') c = (char)(c + ('a' - 'A'));
            }
            return value;
          };
          auto has_text = [](const std::string &value, const char *needle) {
            return value.find(needle) != std::string::npos;
          };
          auto person_location_image = [&](const std::string &zone_value,
                                           const std::string &icon_value)
              -> const lv_img_dsc_t * {
            const std::string zone = lower_person_text(zone_value);
            const std::string icon = lower_person_text(icon_value);
            const std::string combined = icon + " " + zone;

            if (zone == "unknown" || zone == "unavailable" ||
                has_text(icon, "question") || has_text(icon, "help")) {
              return id(person_loc_unknown).get_lv_image_dsc();
            }
            if (zone == "home" || has_text(icon, "mdi:home")) {
              return id(person_loc_home).get_lv_image_dsc();
            }
            // Use a trolley for the larger supermarkets requested; all
            // other recognised shopping locations use the basket icon.
            if (has_text(zone, "big tesco") || has_text(zone, "morrisons") ||
                has_text(zone, "sainsbury")) {
              return id(person_loc_shopping_cart).get_lv_image_dsc();
            }
            if (has_text(combined, "basket") || has_text(combined, "cart") ||
                has_text(combined, "shop") || has_text(combined, "store") ||
                has_text(combined, "supermarket") || has_text(combined, "tesco") ||
                has_text(combined, "sainsbury") || has_text(combined, "waitrose") ||
                has_text(combined, "morrisons") || has_text(combined, "asda") ||
                has_text(combined, "aldi") || has_text(combined, "lidl")) {
              return id(person_loc_shopping).get_lv_image_dsc();
            }
            if (has_text(combined, "office") || has_text(combined, "briefcase") ||
                has_text(combined, "work")) {
              return id(person_loc_work).get_lv_image_dsc();
            }
            if (has_text(combined, "school") || has_text(combined, "college") ||
                has_text(combined, "university")) {
              return id(person_loc_school).get_lv_image_dsc();
            }
            if (has_text(combined, "dumbbell") || has_text(combined, "gym") ||
                has_text(combined, "leisure")) {
              return id(person_loc_gym).get_lv_image_dsc();
            }
            if (has_text(combined, "hospital") || has_text(combined, "medical") ||
                has_text(combined, "doctor") || has_text(combined, "clinic")) {
              return id(person_loc_medical).get_lv_image_dsc();
            }
            if (has_text(combined, "silverware") || has_text(combined, "food") ||
                has_text(combined, "restaurant") || has_text(combined, "cafe") ||
                has_text(combined, "pub")) {
              return id(person_loc_food).get_lv_image_dsc();
            }
            if (has_text(combined, "train") || has_text(combined, "rail") ||
                has_text(combined, "station") || has_text(combined, "subway")) {
              return id(person_loc_train).get_lv_image_dsc();
            }
            if (has_text(combined, "airplane") || has_text(combined, "airport") ||
                has_text(combined, "flight")) {
              return id(person_loc_airplane).get_lv_image_dsc();
            }
            if (has_text(combined, "car") || has_text(combined, "driving") ||
                has_text(combined, "garage")) {
              return id(person_loc_car).get_lv_image_dsc();
            }
            if (has_text(combined, "beach") || has_text(combined, "pool") ||
                has_text(combined, "swim")) {
              return id(person_loc_beach).get_lv_image_dsc();
            }
            if (has_text(combined, "park") || has_text(combined, "tree") ||
                has_text(combined, "forest")) {
              return id(person_loc_park).get_lv_image_dsc();
            }
            return id(person_loc_away).get_lv_image_dsc();
          };
          auto update_person_location = [&](lv_obj_t *widget,
                                            const std::string &zone_value,
                                            const std::string &icon_value,
                                            std::string &last_value) {
            const std::string key = zone_value + "|" + icon_value;
            if (key == last_value) return;
            lv_img_set_src(widget, person_location_image(zone_value, icon_value));

            const std::string zone = lower_person_text(zone_value);
            lv_color_t colour = esp_to_lv(id(cyan));
            if (zone == "home") colour = esp_to_lv(id(green));
            else if (zone == "not_home") colour = esp_to_lv(id(orange));
            else if (zone == "unknown" || zone == "unavailable" || zone.empty())
              colour = esp_to_lv(id(red));
            lv_obj_set_style_img_recolor_opa(widget, LV_OPA_80, LV_PART_MAIN);
            lv_obj_set_style_img_recolor(widget, colour, LV_PART_MAIN);
            last_value = key;
          };

          static std::string last_tim_location = "\x01";
          static std::string last_emma_location = "\x01";
          static std::string last_isobel_location = "\x01";
          static std::string last_ellie_location = "\x01";
          update_person_location(id(person_tim_location_img),
                                 id(person_tim_state).state,
                                 id(person_tim_zone_icon).state,
                                 last_tim_location);
          update_person_location(id(person_emma_location_img),
                                 id(person_emma_state).state,
                                 id(person_emma_zone_icon).state,
                                 last_emma_location);
          update_person_location(id(person_isobel_location_img),
                                 id(person_isobel_state).state,
                                 id(person_isobel_zone_icon).state,
                                 last_isobel_location);
          update_person_location(id(person_ellie_location_img),
                                 id(person_ellie_state).state,
                                 id(person_ellie_zone_icon).state,
                                 last_ellie_location);

          // Compact person layout. All portraits currently at home are packed
          // first and share a single house tile; everyone else keeps their own
          // portrait + location tile. Layout only changes when home membership changes.
          const int person_home_mask =
              (lower_person_text(id(person_tim_state).state) == "home" ? 1 : 0) |
              (lower_person_text(id(person_emma_state).state) == "home" ? 2 : 0) |
              (lower_person_text(id(person_isobel_state).state) == "home" ? 4 : 0) |
              (lower_person_text(id(person_ellie_state).state) == "home" ? 8 : 0);
          static int last_person_home_mask = -1;
          if (person_home_mask != last_person_home_mask) {
            struct PersonTile {
              lv_obj_t *frame;
              lv_obj_t *photo;
              lv_obj_t *badge;
              lv_obj_t *location;
              bool home;
            };
            PersonTile people[] = {
              {id(person_tim_frame), id(person_tim_img),
               id(person_tim_location_badge), id(person_tim_location_img),
               (person_home_mask & 1) != 0},
              {id(person_emma_frame), id(person_emma_img),
               id(person_emma_location_badge), id(person_emma_location_img),
               (person_home_mask & 2) != 0},
              {id(person_isobel_frame), id(person_isobel_img),
               id(person_isobel_location_badge), id(person_isobel_location_img),
               (person_home_mask & 4) != 0},
              {id(person_ellie_frame), id(person_ellie_img),
               id(person_ellie_location_badge), id(person_ellie_location_img),
               (person_home_mask & 8) != 0},
            };

            const int start_x = 392;
            const int tile_step = 70;  // 62 px tile + 8 px gap.
            int person_x = start_x;
            int shared_home_index = -1;

            auto place_portrait = [&](PersonTile &person) {
              lv_obj_set_x(person.frame, person_x);
              lv_obj_set_x(person.photo, person_x + 2);
              set_visible(person.frame, true);
              set_visible(person.photo, true);
              person_x += tile_step;
            };
            auto place_location = [&](PersonTile &person) {
              lv_obj_set_x(person.badge, person_x);
              lv_obj_set_x(person.location, person_x + 2);
              set_visible(person.badge, true);
              set_visible(person.location, true);
              person_x += tile_step;
            };

            // Start with all location tiles hidden. Portraits are always shown.
            for (auto &person : people) {
              set_visible(person.badge, false);
              set_visible(person.location, false);
            }

            // Pack all home portraits together at the left.
            for (int i = 0; i < 4; i++) {
              if (!people[i].home) continue;
              place_portrait(people[i]);
              if (shared_home_index < 0) shared_home_index = i;
            }

            // One shared house icon follows the complete home group.
            if (shared_home_index >= 0) {
              place_location(people[shared_home_index]);
            }

            // Non-home people follow, each with their own current zone icon.
            for (int i = 0; i < 4; i++) {
              if (people[i].home) continue;
              place_portrait(people[i]);
              place_location(people[i]);
            }

            last_person_home_mask = person_home_mask;
          }

          // ORCL price and direction.
          static std::string last_oracle_price = "\x01";
          static std::string last_oracle_change = "\x01";
          const std::string oracle_price_value = id(oracle_price).state;
          const std::string oracle_change_value = id(oracle_change).state;
          if (oracle_price_value != last_oracle_price) {
            lv_label_set_text(id(oracle_price_label), oracle_price_value.c_str());
            last_oracle_price = oracle_price_value;
          }
          if (oracle_change_value != last_oracle_change) {
            if (oracle_change_value == "Up") {
              lv_obj_set_style_text_color(id(oracle_price_label),
                lv_color_make(id(sage_green).r, id(sage_green).g, id(green).b), LV_PART_MAIN);
            } else if (oracle_change_value == "Down") {
              lv_obj_set_style_text_color(id(oracle_price_label),
                lv_color_make(id(orange).r, id(orange).g, id(red).b), LV_PART_MAIN);
            } else {
              lv_obj_set_style_text_color(id(oracle_price_label), esp_to_lv(id(white)), LV_PART_MAIN);
            }
            last_oracle_change = oracle_change_value;
          }

          // Washing-machine minutes. Keep the label hidden unless the washer
          // is actively running, and refresh visibility when that state changes.
          static int last_minutes = -99999;
          static int last_minutes_washing = -1;
          const float minutes_value = id(wm_minutes_left).state;
          const int minutes = (isnan(minutes_value) || minutes_value <= 0.0f)
                                ? -1 : (int) minutes_value;
          if (minutes != last_minutes || washing != last_minutes_washing) {
            if (!washing || minutes < 0) {
              lv_label_set_text(id(wm_minutes_label), "--");
              lv_obj_add_flag(id(wm_minutes_label), LV_OBJ_FLAG_HIDDEN);
            } else {
              char minute_buf[16];
              snprintf(minute_buf, sizeof(minute_buf), "%d", minutes);
              lv_label_set_text(id(wm_minutes_label), minute_buf);
              lv_obj_clear_flag(id(wm_minutes_label), LV_OBJ_FLAG_HIDDEN);
            }
            last_minutes = minutes;
            last_minutes_washing = washing;
          }

          // Outdoor and indoor temperatures, rounded to the displayed tenth.
          static int last_outdoor_tenths = -99999;
          static int last_indoor_tenths = -99999;
          const float outdoor = id(weather_current_temp).state;
          const float indoor = id(thermostat_current_temp).state;
          const int outdoor_tenths = isnan(outdoor) ? -99999 : (int) lroundf(outdoor * 10.0f);
          const int indoor_tenths = isnan(indoor) ? -99999 : (int) lroundf(indoor * 10.0f);
          if (outdoor_tenths != last_outdoor_tenths) {
            char temp_buf[12];
            if (outdoor_tenths == -99999) snprintf(temp_buf, sizeof(temp_buf), "--");
            else snprintf(temp_buf, sizeof(temp_buf), "%.1f", outdoor);
            const lv_color_t color = outdoor_tenths == -99999
                                     ? lv_color_hex(0xA6A6A6) : temp_color(outdoor);
            lv_label_set_text(id(weather_current_temp_label), temp_buf);
            lv_obj_set_style_text_color(id(weather_current_temp_label), color, LV_PART_MAIN);
            lv_obj_set_style_text_color(id(degree_symbol_weather), color, LV_PART_MAIN);
            lv_obj_align_to(id(degree_symbol_weather), id(weather_current_temp_label),
                            LV_ALIGN_OUT_RIGHT_TOP, 3, 1);
            last_outdoor_tenths = outdoor_tenths;
          }
          if (indoor_tenths != last_indoor_tenths) {
            lv_obj_t *temp_segments[] = {
              id(indoor_temp_bar_1), id(indoor_temp_bar_2), id(indoor_temp_bar_3),
              id(indoor_temp_bar_4), id(indoor_temp_bar_5), id(indoor_temp_bar_6),
              id(indoor_temp_bar_7), id(indoor_temp_bar_8), id(indoor_temp_bar_9),
              id(indoor_temp_bar_10)
            };

            if (indoor_tenths == -99999) {
              lv_obj_set_style_img_recolor_opa(id(indoor_thermometer_img), LV_OPA_40, LV_PART_MAIN);
              lv_obj_set_style_img_recolor(id(indoor_thermometer_img), lv_color_hex(0x17343A), LV_PART_MAIN);
              for (int i = 0; i < 10; i++) {
                lv_obj_set_style_bg_color(temp_segments[i], lv_color_hex(0x17343A), LV_PART_MAIN);
                lv_obj_set_style_bg_opa(temp_segments[i], 90, LV_PART_MAIN);
                lv_obj_set_style_shadow_opa(temp_segments[i], LV_OPA_TRANSP, LV_PART_MAIN);
              }
            } else {
              // 15 C lights the first segment; 33 C lights all ten. Values
              // outside the display range are clamped to the nearest end.
              float clamped = indoor;
              if (clamped < 15.0f) clamped = 15.0f;
              if (clamped > 33.0f) clamped = 33.0f;
              int temp_bars = 1 + (int) ceilf((clamped - 15.0f) / 2.0f);
              if (temp_bars < 1) temp_bars = 1;
              if (temp_bars > 10) temp_bars = 10;

              // Room-temperature bands: cool blue, comfortable green, warm
              // orange, then hot red. These are intentionally separate from
              // the outdoor-weather colour thresholds used above.
              lv_color_t room_color;
              if (indoor <= 17.0f) room_color = lv_color_hex(0x3498DB);
              else if (indoor <= 23.0f) room_color = lv_color_hex(0x43D17A);
              else if (indoor <= 27.0f) room_color = lv_color_hex(0xFF9F32);
              else room_color = lv_color_hex(0xF04D4D);

              lv_obj_set_style_img_recolor_opa(id(indoor_thermometer_img), LV_OPA_80, LV_PART_MAIN);
              lv_obj_set_style_img_recolor(id(indoor_thermometer_img), room_color, LV_PART_MAIN);

              for (int i = 0; i < 10; i++) {
                if (i < temp_bars) {
                  lv_obj_set_style_bg_color(temp_segments[i], room_color, LV_PART_MAIN);
                  lv_obj_set_style_bg_opa(temp_segments[i], LV_OPA_COVER, LV_PART_MAIN);
                  lv_obj_set_style_shadow_color(temp_segments[i], room_color, LV_PART_MAIN);
                  lv_obj_set_style_shadow_opa(temp_segments[i], 90, LV_PART_MAIN);
                } else {
                  lv_obj_set_style_bg_color(temp_segments[i], lv_color_hex(0x17343A), LV_PART_MAIN);
                  lv_obj_set_style_bg_opa(temp_segments[i], 115, LV_PART_MAIN);
                  lv_obj_set_style_shadow_opa(temp_segments[i], LV_OPA_TRANSP, LV_PART_MAIN);
                }
              }
            }
            last_indoor_tenths = indoor_tenths;
          }

          // Keep the animation quiet briefly after the combined LVGL pass.
          id(ui_quiet_until) = millis() + 180UL;

  # Refresh the visual two-position selector from the persistent global.
  - id: refresh_idle_profile_ui
    mode: restart
    then:
      - lambda: |-
          const bool voice = id(voice_wake_enabled);
          const lv_color_t selected_bg = lv_color_hex(0x0A6170);
          const lv_color_t idle_bg = lv_color_hex(0x061B22);
          const lv_color_t selected_border = lv_color_hex(0x8EFFFF);
          const lv_color_t idle_border = lv_color_hex(0x24616A);
          const lv_color_t selected_text = lv_color_hex(0xF4FFFF);
          const lv_color_t idle_text = lv_color_hex(0x86B7BD);

          lv_obj_set_style_bg_color(id(idle_profile_anim_segment), voice ? idle_bg : selected_bg, LV_PART_MAIN);
          lv_obj_set_style_bg_opa(id(idle_profile_anim_segment), voice ? 210 : 235, LV_PART_MAIN);
          lv_obj_set_style_border_color(id(idle_profile_anim_segment), voice ? idle_border : selected_border, LV_PART_MAIN);
          lv_obj_set_style_border_opa(id(idle_profile_anim_segment), voice ? 150 : 255, LV_PART_MAIN);
          lv_obj_set_style_shadow_width(id(idle_profile_anim_segment), voice ? 0 : 10, LV_PART_MAIN);
          lv_obj_set_style_shadow_color(id(idle_profile_anim_segment), selected_border, LV_PART_MAIN);
          lv_obj_set_style_shadow_opa(id(idle_profile_anim_segment), voice ? 0 : 90, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(idle_profile_anim_label), voice ? idle_text : selected_text, LV_PART_MAIN);

          lv_obj_set_style_bg_color(id(idle_profile_voice_segment), voice ? selected_bg : idle_bg, LV_PART_MAIN);
          lv_obj_set_style_bg_opa(id(idle_profile_voice_segment), voice ? 235 : 210, LV_PART_MAIN);
          lv_obj_set_style_border_color(id(idle_profile_voice_segment), voice ? selected_border : idle_border, LV_PART_MAIN);
          lv_obj_set_style_border_opa(id(idle_profile_voice_segment), voice ? 255 : 150, LV_PART_MAIN);
          lv_obj_set_style_shadow_width(id(idle_profile_voice_segment), voice ? 10 : 0, LV_PART_MAIN);
          lv_obj_set_style_shadow_color(id(idle_profile_voice_segment), selected_border, LV_PART_MAIN);
          lv_obj_set_style_shadow_opa(id(idle_profile_voice_segment), voice ? 90 : 0, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(idle_profile_voice_label), voice ? selected_text : idle_text, LV_PART_MAIN);

  # Change idle profile only while the voice pipeline and speaker are idle.
  - id: set_idle_profile
    mode: restart
    parameters:
      voice_wake: bool
    then:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - not:
                  speaker.is_playing:
          then:
            - lambda: |-
                id(jarvis_audio_freeze) = true;
                id(voice_wake_enabled) = voice_wake;
            - script.execute: refresh_idle_profile_ui
            - micro_wake_word.stop:
            - microphone.stop_capture:
                id: tab5_microphone
            - wait_until:
                condition:
                  lambda: 'return !id(mww).is_running();'
                timeout: 2s
            - script.execute:
                id: jarvis_set_mode
                mode: 0
            # Give the animation loop one frame to clear old profile-specific
            # overlays before either starting MWW or resuming full animation.
            - delay: 220ms
            - if:
                condition:
                  lambda: 'return id(voice_wake_enabled);'
                then:
                  - micro_wake_word.start:
                  - lambda: |-
                      id(jarvis_audio_freeze) = false;
                else:
                  - lambda: |-
                      id(jarvis_audio_freeze) = false;
          else:
            - logger.log: "Idle mode change ignored while voice/audio is active"

  # Return to the selected idle profile after a voice interaction.
  - id: jarvis_return_to_idle
    mode: restart
    then:
      - micro_wake_word.stop:
      - microphone.stop_capture:
          id: tab5_microphone
      - lambda: |-
          id(jarvis_audio_freeze) = true;
      - script.execute:
          id: jarvis_set_mode
          mode: 0
      - delay: 220ms
      - if:
          condition:
            lambda: 'return id(voice_wake_enabled);'
          then:
            - micro_wake_word.start:
            - lambda: |-
                id(jarvis_audio_freeze) = false;
          else:
            - lambda: |-
                id(jarvis_audio_freeze) = false;

  # Touch-started conversations must first release the wake-word microphone.
  # This avoids the shared ESP32-P4 I2S bus remaining owned by RX when TTS starts.
  - id: jarvis_start_voice
    mode: restart
    then:
      - lambda: |-
          id(jarvis_audio_freeze) = true;
      - micro_wake_word.stop:
      - microphone.stop_capture:
          id: tab5_microphone
      - delay: 150ms
      - script.execute:
          id: jarvis_set_mode
          mode: 1
      - voice_assistant.start:

  # Direct GT911 light-control actions. These bypass LVGL's widget hit test
  # entirely and retain the original working Home Assistant action pattern.
  - id: toggle_pendant_light
    mode: single
    then:
      - logger.log: "Pendant direct touch pressed"
      - homeassistant.action:
          action: light.toggle
          data:
            entity_id: ${ha_light_office_pendant}

  - id: toggle_wled_light
    mode: single
    then:
      - logger.log: "WLED direct touch pressed"
      - homeassistant.action:
          action: light.toggle
          data:
            entity_id: ${ha_light_wled}

  - id: toggle_lamp_light
    mode: single
    then:
      - logger.log: "Lamp direct touch pressed"
      - homeassistant.action:
          action: light.toggle
          data:
            entity_id: ${ha_light_smart_bulb}

  - id: jarvis_set_mode
    mode: restart
    parameters:
      mode: int
    then:
      - lambda: |-
          id(jarvis_mode) = mode;
          // Reset the phase so every state transition has a crisp visual start.
          id(jarvis_phase) = 0.0f;

          // The center-bottom readout appears only during microphone capture.
          // It is static, so showing it adds almost no ongoing render workload.
          if (mode == 1) {
            lv_obj_clear_flag(id(hud_listening_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(hud_listening_wave), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(hud_listening_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(hud_listening_wave), LV_OBJ_FLAG_HIDDEN);
          }
  # Script executed when we want to play sounds on the device.
  - id: play_sound
    parameters:
      priority: bool
      sound_file: "audio::AudioFile*"
    then:
      - lambda: |-
          if (priority) {
            id(external_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_STOP)
              .set_announcement(true)
              .perform();
          }
          if ( (id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ) || priority) {
            id(external_media_player)
              ->play_file(sound_file, true, false);
          }
  - id: time_update
    then:
      - lambda: |-
          auto now = id(time_comp).now();
          static std::string last_time_text;
          static std::string last_date_text;
          if (!now.is_valid()) {
            if (last_time_text != "--:--") {
              lv_label_set_text(id(digital_time_label), "--:--");
              last_time_text = "--:--";
            }
            if (last_date_text != "--- -- ---") {
              lv_label_set_text(id(digital_date_label), "--- -- ---");
              last_date_text = "--- -- ---";
            }
            return;
          }

          static const char *days[] = {
            "SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"
          };
          static const char *months[] = {
            "JAN", "FEB", "MAR", "APR", "MAY", "JUN",
            "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"
          };

          char time_buf[6];
          snprintf(time_buf, sizeof(time_buf), "%02u:%02u",
                   (unsigned) now.hour, (unsigned) now.minute);
          if (last_time_text != time_buf) {
            lv_label_set_text(id(digital_time_label), time_buf);
            last_time_text = time_buf;
          }

          const unsigned day_index = (now.day_of_week >= 1 && now.day_of_week <= 7)
                                       ? (unsigned) now.day_of_week - 1U : 0U;
          const unsigned month_index = (now.month >= 1 && now.month <= 12)
                                         ? (unsigned) now.month - 1U : 0U;

          char date_buf[48];
          snprintf(date_buf, sizeof(date_buf), "%s %u %s",
                   days[day_index],
                   (unsigned) now.day_of_month,
                   months[month_index]);
          if (last_date_text != date_buf) {
            lv_label_set_text(id(digital_date_label), date_buf);
            last_date_text = date_buf;
          }
      - script.execute: refresh_oracle_health_panel

  - id: show_notification
    parameters:
      message: string
    then:
      - lambda: |-
           id(notification_active) = true;
           lv_label_set_text(id(ha_notification_label), message.c_str());
           lv_obj_clear_flag(id(ha_notification_label), LV_OBJ_FLAG_HIDDEN);

      # repeat 5 times
      - repeat:
          count: 5
          then:
            - lvgl.label.update:
                id: ha_notification_label
            - delay: 3s

      # hide after done
      - lambda: |-
          lv_obj_add_flag(id(ha_notification_label), LV_OBJ_FLAG_HIDDEN);
          id(notification_active) = false;

  - id: restore_display_timer
    then:
      - delay: 5s
      - lambda: |-
          ESP_LOGI("camera", "Hiding camera image");
          
          if (id(camera_overlay_obj) != nullptr) {
            lv_obj_del(id(camera_overlay_obj));
            id(camera_overlay_obj) = nullptr;
          }
          
          if (id(image_buffer) != nullptr) {
            free(id(image_buffer));
            id(image_buffer) = nullptr;
          }
          
          ESP_LOGI("camera", "Cleanup complete"); 
