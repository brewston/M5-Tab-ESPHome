touchscreen:
  - platform: gt911
    interrupt_pin: GPIO23
    display: my_lcd
    update_interval: never
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 5
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: false
    calibration:
      x_min: 0
      x_max: 1280
      y_min: 0
      y_max: 720
    id: my_touchscreen
    on_touch:
      - lambda: |-
          // Log transformed coordinates so future calibration issues are visible.
          ESP_LOGI("touch", "GT911 touch x=%d y=%d raw_x=%d raw_y=%d",
                   touch.x, touch.y, touch.x_raw, touch.y_raw);

          // Calibrated from the actual GT911 values reported by this Tab5.
          // The reliable coordinates for this rotated panel are x_raw/y_raw.
          const int raw_x = touch.x_raw;
          const int raw_y = touch.y_raw;

          // Two-position idle-profile selector at the top of the screen.
          // The display y range 18-68 maps to raw_y roughly 652-702.
          const bool idle_mode_row = (raw_y >= 635 && raw_y <= 715);
          const bool animation_mode_pressed = idle_mode_row && (raw_x >= 790 && raw_x < 920);
          const bool voice_mode_pressed = idle_mode_row && (raw_x >= 920 && raw_x <= 1060);

          if (animation_mode_pressed) {
            ESP_LOGI("touch", "Animation idle mode selected raw_x=%d raw_y=%d", raw_x, raw_y);
            id(set_idle_profile).execute(false);
            return;
          }
          if (voice_mode_pressed) {
            ESP_LOGI("touch", "Voice-wake idle mode selected raw_x=%d raw_y=%d", raw_x, raw_y);
            id(set_idle_profile).execute(true);
            return;
          }

          // All three light buttons report raw_x around 1206-1223. Keep the zone
          // deliberately wide so the full visual button is easy to press.
          const bool in_light_column = (raw_x >= 1120 && raw_x <= 1279);

          // Measured centres from top to bottom:
          // PENDANT ~= 607, WLED ~= 464, LAMP ~= 341.
          const bool pendant_pressed = in_light_column && (raw_y >= 535 && raw_y <= 665);
          const bool wled_pressed    = in_light_column && (raw_y >= 405 && raw_y <= 525);
          const bool lamp_pressed    = in_light_column && (raw_y >= 275 && raw_y <= 395);

          if (pendant_pressed) {
            ESP_LOGI("touch", "Pendant calibrated zone matched raw_x=%d raw_y=%d", raw_x, raw_y);
            id(toggle_pendant_light).execute();
          } else if (wled_pressed) {
            ESP_LOGI("touch", "WLED calibrated zone matched raw_x=%d raw_y=%d", raw_x, raw_y);
            id(toggle_wled_light).execute();
          } else if (lamp_pressed) {
            ESP_LOGI("touch", "Lamp calibrated zone matched raw_x=%d raw_y=%d", raw_x, raw_y);
            id(toggle_lamp_light).execute();
          }
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "LVGL resuming"
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: backlight

esp_ldo:
  - voltage: 2.5V
    channel: 3

display:
  - platform: mipi_dsi
    id: my_lcd
    dimensions:
      height: 1280
      width: 720
    model: M5Stack-Tab5
   # invert_colors: true
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4
   # show_test_card: true

