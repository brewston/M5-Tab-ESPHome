# The code that changes the travel poster every 5 mins.

interval:
  # Jarvis HUD animation. The phases are intentionally exclusive:
  # ready = restrained rings, listening = large glowing points,
  # speaking = expanding pulse waves, processing = particle cloud.
  - interval: 160ms
    then:
      - lambda: |-
          // Keep the notification label smooth by suspending every Jarvis HUD
          // redraw for the full time that the notification is visible.
          if (id(notification_active) ||
              (int32_t)(millis() - id(ui_quiet_until)) < 0) {
            return;
          }

          id(jarvis_frame)++;
          const int mode = id(jarvis_mode);
          const float PI_F = 3.14159265f;

          // Create the reusable listening lights and processing particles once.
          // They are then restyled rather than allocated during voice activity.
          static lv_obj_t *listen_glows[8] = {};
          static lv_obj_t *listen_dots[8] = {};
          static lv_obj_t *cloud_particles[36] = {};

          if (cloud_particles[0] == nullptr) {
            for (int i = 0; i < 36; i++) {
              cloud_particles[i] = lv_obj_create(id(jarvis_hud));
              const int size = 2 + ((i * 7) % 3);
              const float angle = ((float)i / 36.0f) * 2.0f * PI_F
                                  + (((i * 13) % 9) - 4) * 0.010f;
              const float radius = 215.0f + (float)((i * 37) % 34);
              const int x = (int)(255.0f + cosf(angle) * radius - size * 0.5f);
              const int y = (int)(255.0f + sinf(angle) * radius - size * 0.5f);

              lv_obj_set_size(cloud_particles[i], size, size);
              lv_obj_set_pos(cloud_particles[i], x, y);
              lv_obj_set_style_radius(cloud_particles[i], LV_RADIUS_CIRCLE, LV_PART_MAIN);
              lv_obj_set_style_border_width(cloud_particles[i], 0, LV_PART_MAIN);
              lv_obj_set_style_bg_color(cloud_particles[i], lv_color_hex(0x00DDF5), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(cloud_particles[i], LV_OPA_TRANSP, LV_PART_MAIN);
              lv_obj_clear_flag(cloud_particles[i], LV_OBJ_FLAG_SCROLLABLE);
              lv_obj_clear_flag(cloud_particles[i], LV_OBJ_FLAG_CLICKABLE);
              lv_obj_move_background(cloud_particles[i]);
            }

            const float dot_degrees[8] = {12.0f, 58.0f, 111.0f, 171.0f,
                                          222.0f, 274.0f, 319.0f, 347.0f};
            for (int i = 0; i < 8; i++) {
              const float angle = dot_degrees[i] * PI_F / 180.0f;
              const float radius = 226.0f + (float)(((i * 11) % 9) - 4);
              const int dot_size = (i == 1 || i == 4 || i == 6) ? 18 : 13;
              const int glow_size = dot_size + 28;
              const int cx = (int)(255.0f + cosf(angle) * radius);
              const int cy = (int)(255.0f + sinf(angle) * radius);

              listen_glows[i] = lv_obj_create(id(jarvis_hud));
              lv_obj_set_size(listen_glows[i], glow_size, glow_size);
              lv_obj_set_pos(listen_glows[i], cx - glow_size / 2, cy - glow_size / 2);
              lv_obj_set_style_radius(listen_glows[i], LV_RADIUS_CIRCLE, LV_PART_MAIN);
              lv_obj_set_style_border_width(listen_glows[i], 0, LV_PART_MAIN);
              lv_obj_set_style_bg_color(listen_glows[i], lv_color_hex(0x00EAF7), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(listen_glows[i], LV_OPA_TRANSP, LV_PART_MAIN);
              lv_obj_set_style_shadow_width(listen_glows[i], 24, LV_PART_MAIN);
              lv_obj_set_style_shadow_color(listen_glows[i], lv_color_hex(0x00EAF7), LV_PART_MAIN);
              lv_obj_set_style_shadow_opa(listen_glows[i], LV_OPA_TRANSP, LV_PART_MAIN);
              lv_obj_clear_flag(listen_glows[i], LV_OBJ_FLAG_SCROLLABLE);
              lv_obj_clear_flag(listen_glows[i], LV_OBJ_FLAG_CLICKABLE);

              listen_dots[i] = lv_obj_create(id(jarvis_hud));
              lv_obj_set_size(listen_dots[i], dot_size, dot_size);
              lv_obj_set_pos(listen_dots[i], cx - dot_size / 2, cy - dot_size / 2);
              lv_obj_set_style_radius(listen_dots[i], LV_RADIUS_CIRCLE, LV_PART_MAIN);
              lv_obj_set_style_border_width(listen_dots[i], 0, LV_PART_MAIN);
              lv_obj_set_style_bg_color(listen_dots[i], lv_color_hex(0xF4FFFF), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(listen_dots[i], LV_OPA_TRANSP, LV_PART_MAIN);
              lv_obj_set_style_shadow_width(listen_dots[i], 0, LV_PART_MAIN);
              lv_obj_set_style_shadow_opa(listen_dots[i], LV_OPA_TRANSP, LV_PART_MAIN);
              lv_obj_clear_flag(listen_dots[i], LV_OBJ_FLAG_SCROLLABLE);
              lv_obj_clear_flag(listen_dots[i], LV_OBJ_FLAG_CLICKABLE);
            }

            // Wake-word detection is deliberately started only after all
            // reusable LVGL objects have been allocated and styled once.
            id(jarvis_visuals_ready) = true;
          }

          lv_obj_t *segments[] = {
            id(jarvis_outer_a), id(jarvis_outer_b), id(jarvis_outer_c),
            id(jarvis_mid_a), id(jarvis_mid_b), id(jarvis_inner_a),
            id(jarvis_inner_b)
          };
          lv_obj_t *outer_glows[] = {
            id(jarvis_outer_glow_a), id(jarvis_outer_glow_b), id(jarvis_outer_glow_c)
          };
          lv_obj_t *speaking_mist_arcs[] = {
            id(jarvis_speaking_mist_1), id(jarvis_speaking_mist_2),
            id(jarvis_speaking_mist_3), id(jarvis_speaking_mist_4),
            id(jarvis_speaking_mist_5), id(jarvis_speaking_mist_6)
          };
          lv_obj_t *pulse_objs[] = {
            id(jarvis_pulse_1), id(jarvis_pulse_2), id(jarvis_pulse_3)
          };
          lv_obj_t *flares[] = {
            id(jarvis_flare_ne), id(jarvis_flare_se),
            id(jarvis_flare_sw), id(jarvis_flare_nw)
          };

          // Apply each phase's appearance once. Listening, speaking and error
          // remain static after this point, protecting microphone and speaker timing.
          static int previous_mode = -1;
          static bool previous_voice_wake_enabled = true;
          const bool profile_changed = id(voice_wake_enabled) != previous_voice_wake_enabled;
          const bool mode_changed = mode != previous_mode || profile_changed;
          if (mode_changed) {
            previous_mode = mode;
            previous_voice_wake_enabled = id(voice_wake_enabled);
            id(jarvis_phase) = 0.0f;

            // Clear every phase-specific overlay first.
            for (int i = 0; i < 8; i++) {
              lv_obj_set_style_bg_opa(listen_glows[i], LV_OPA_TRANSP, LV_PART_MAIN);
              lv_obj_set_style_shadow_opa(listen_glows[i], LV_OPA_TRANSP, LV_PART_MAIN);
              lv_obj_set_style_bg_opa(listen_dots[i], LV_OPA_TRANSP, LV_PART_MAIN);
            }
            for (int i = 0; i < 12; i++) {
              lv_obj_set_style_bg_opa(cloud_particles[i], LV_OPA_TRANSP, LV_PART_MAIN);
            }
            for (int i = 0; i < 6; i++) {
              lv_obj_set_style_arc_opa(speaking_mist_arcs[i], LV_OPA_TRANSP, LV_PART_MAIN);
            }
            for (int i = 0; i < 3; i++) {
              lv_obj_set_style_border_opa(pulse_objs[i], LV_OPA_TRANSP, LV_PART_MAIN);
            }
            for (int i = 0; i < 4; i++) {
              lv_obj_set_style_bg_opa(flares[i], LV_OPA_TRANSP, LV_PART_MAIN);
              lv_obj_set_style_shadow_opa(flares[i], LV_OPA_TRANSP, LV_PART_MAIN);
            }

            lv_color_t accent = lv_color_hex(0x00EAF7);
            lv_color_t accent2 = lv_color_hex(0x35AFFF);
            lv_color_t hot = lv_color_hex(0xF8FFFF);
            uint8_t segment_opa = 130;
            uint8_t glow_opa = 42;
            uint8_t halo_opa = 48;

            if (mode == 1) {
              accent = lv_color_hex(0x00F4FF);
              accent2 = lv_color_hex(0x7DF9FF);
              hot = lv_color_hex(0xFFFFFF);
              segment_opa = 215;
              glow_opa = 105;
              halo_opa = 150;
            } else if (mode == 2) {
              accent = lv_color_hex(0x19E7FF);
              accent2 = lv_color_hex(0xB9FBFF);
              hot = lv_color_hex(0xFFFFFF);
              segment_opa = 195;
              glow_opa = 92;
              halo_opa = 130;
            } else if (mode == 3) {
              accent = lv_color_hex(0x00C8FF);
              accent2 = lv_color_hex(0x6B8CFF);
              hot = lv_color_hex(0xF8FFFF);
              segment_opa = 210;
              glow_opa = 78;
              halo_opa = 140;
            } else if (mode == 4) {
              accent = lv_color_hex(0xFF315F);
              accent2 = lv_color_hex(0xFF6CB5);
              hot = lv_color_hex(0xFFF0F5);
              segment_opa = 240;
              glow_opa = 165;
              halo_opa = 225;
            }

            for (auto *obj : segments) {
              lv_obj_set_style_arc_color(obj, accent, LV_PART_MAIN);
              lv_obj_set_style_arc_opa(obj, segment_opa, LV_PART_MAIN);
            }
            lv_obj_set_style_arc_color(id(jarvis_mid_b), accent2, LV_PART_MAIN);
            lv_obj_set_style_arc_color(id(jarvis_inner_a), hot, LV_PART_MAIN);
            for (auto *obj : outer_glows) {
              lv_obj_set_style_arc_color(obj, accent, LV_PART_MAIN);
              lv_obj_set_style_arc_opa(obj, glow_opa, LV_PART_MAIN);
            }
            lv_obj_set_style_arc_color(id(jarvis_halo), accent, LV_PART_MAIN);
            lv_obj_set_style_arc_opa(id(jarvis_halo), halo_opa, LV_PART_MAIN);

            if (mode == 1) {
              // Static listening snapshot: large uneven points and strong cyan aura.
              const uint8_t dot_opacity[8] = {205, 255, 225, 185, 250, 210, 255, 195};
              const uint8_t glow_opacity[8] = {95, 165, 125, 82, 158, 105, 170, 88};
              for (int i = 0; i < 8; i++) {
                lv_obj_set_style_bg_color(listen_glows[i], accent, LV_PART_MAIN);
                lv_obj_set_style_shadow_color(listen_glows[i], accent, LV_PART_MAIN);
                lv_obj_set_style_bg_opa(listen_glows[i], glow_opacity[i] / 3, LV_PART_MAIN);
                lv_obj_set_style_shadow_opa(listen_glows[i], glow_opacity[i], LV_PART_MAIN);
                lv_obj_set_style_bg_color(listen_dots[i], hot, LV_PART_MAIN);
                lv_obj_set_style_bg_opa(listen_dots[i], dot_opacity[i], LV_PART_MAIN);
              }
            } else if (mode == 2) {
              // Static speaking snapshot: mist outside the ring plus three expanded waves.
              const int mist_rotation[6] = {8, 64, 132, 201, 267, 326};
              const uint8_t mist_opacity[6] = {74, 42, 62, 38, 56, 34};
              for (int i = 0; i < 6; i++) {
                lv_arc_set_rotation(speaking_mist_arcs[i], mist_rotation[i]);
                lv_obj_set_style_arc_color(
                    speaking_mist_arcs[i],
                    (i == 2 || i == 5) ? hot : ((i % 2 == 0) ? accent : accent2),
                    LV_PART_MAIN);
                lv_obj_set_style_arc_opa(speaking_mist_arcs[i], mist_opacity[i], LV_PART_MAIN);
              }
              const int pulse_size[3] = {314, 274, 234};
              const uint8_t pulse_opa[3] = {105, 72, 42};
              const lv_color_t pulse_colors[3] = {accent, accent2, hot};
              for (int i = 0; i < 3; i++) {
                lv_obj_set_size(pulse_objs[i], pulse_size[i], pulse_size[i]);
                lv_obj_center(pulse_objs[i]);
                lv_obj_set_style_border_color(pulse_objs[i], pulse_colors[i], LV_PART_MAIN);
                lv_obj_set_style_border_opa(pulse_objs[i], pulse_opa[i], LV_PART_MAIN);
              }
              for (int i = 0; i < 4; i++) {
                lv_obj_set_style_bg_color(flares[i], hot, LV_PART_MAIN);
                lv_obj_set_style_bg_opa(flares[i], 95 - i * 10, LV_PART_MAIN);
                lv_obj_set_style_shadow_color(flares[i], accent, LV_PART_MAIN);
                lv_obj_set_style_shadow_opa(flares[i], 120 - i * 12, LV_PART_MAIN);
              }
            } else if (mode == 3) {
              // Initial processing cloud; the first 12 particles animate below.
              for (int i = 0; i < 12; i++) {
                lv_obj_set_style_bg_color(
                    cloud_particles[i],
                    (i % 3 == 0) ? hot : ((i % 2 == 0) ? accent2 : accent),
                    LV_PART_MAIN);
                lv_obj_set_style_bg_opa(cloud_particles[i], 85 + ((i * 17) % 85), LV_PART_MAIN);
              }
              lv_obj_set_size(pulse_objs[0], 250, 250);
              lv_obj_center(pulse_objs[0]);
              lv_obj_set_style_border_color(pulse_objs[0], accent2, LV_PART_MAIN);
              lv_obj_set_style_border_opa(pulse_objs[0], 58, LV_PART_MAIN);
            } else if (mode == 4) {
              // Static error snapshot: red arcs, points and pulse rings.
              for (int i = 0; i < 8; i++) {
                lv_obj_set_style_bg_color(listen_glows[i], accent2, LV_PART_MAIN);
                lv_obj_set_style_shadow_color(listen_glows[i], accent, LV_PART_MAIN);
                lv_obj_set_style_bg_opa(listen_glows[i], 28, LV_PART_MAIN);
                lv_obj_set_style_shadow_opa(listen_glows[i], 145, LV_PART_MAIN);
                lv_obj_set_style_bg_color(listen_dots[i], hot, LV_PART_MAIN);
                lv_obj_set_style_bg_opa(listen_dots[i], 220, LV_PART_MAIN);
              }
              const int error_sizes[3] = {300, 255, 215};
              const uint8_t error_opacity[3] = {225, 135, 78};
              for (int i = 0; i < 3; i++) {
                lv_obj_set_size(pulse_objs[i], error_sizes[i], error_sizes[i]);
                lv_obj_center(pulse_objs[i]);
                lv_obj_set_style_border_color(pulse_objs[i], (i == 1) ? accent2 : accent, LV_PART_MAIN);
                lv_obj_set_style_border_opa(pulse_objs[i], error_opacity[i], LV_PART_MAIN);
              }
            }
          }

          auto wrap360 = [](float value) -> int {
            int out = (int) fmodf(value, 360.0f);
            if (out < 0) out += 360;
            return out;
          };

          // VOICE profile always keeps idle static, including the short period
          // before microWakeWord has started. Any active MWW task also blocks
          // redraws. Thinking remains available because it uses mode 3 after
          // microphone capture and wake-word detection have stopped.
          if ((id(voice_wake_enabled) && mode == 0) || id(mww).is_running()) {
            return;
          }

          // Listening, speaking and error are deliberately static. A freeze also
          // blocks any out-of-order frame while audio resources are active.
          if (id(jarvis_audio_freeze) || mode == 1 || mode == 2 || mode == 4) {
            return;
          }

          if (mode == 3) {
            // THINKING: every 480 ms, move only three arcs and flicker 12 tiny
            // shadow-free particles. No mist, dots, pulse resizing or flares.
            if ((id(jarvis_frame) % 3U) != 0U) {
              return;
            }

            id(jarvis_phase) += 0.11f;
            const float p = id(jarvis_phase);
            lv_arc_set_rotation(id(jarvis_mid_a), wrap360(42.0f - p * 13.0f));
            lv_arc_set_rotation(id(jarvis_mid_b), wrap360(224.0f + p * 10.0f));
            lv_arc_set_rotation(id(jarvis_inner_a), wrap360(8.0f + p * 16.0f));

            const float breath = (sinf(p * 2.1f) + 1.0f) * 0.5f;
            const uint8_t arc_opa = 150 + (uint8_t)(breath * 60.0f);
            lv_obj_set_style_arc_opa(id(jarvis_mid_a), arc_opa, LV_PART_MAIN);
            lv_obj_set_style_arc_opa(id(jarvis_mid_b), arc_opa, LV_PART_MAIN);
            lv_obj_set_style_arc_opa(id(jarvis_inner_a), arc_opa, LV_PART_MAIN);

            for (int i = 0; i < 12; i++) {
              const float ripple = (sinf(p * 5.1f - i * 0.79f) + 1.0f) * 0.5f;
              const uint8_t opa = 45 + (uint8_t)(ripple * 155.0f);
              lv_obj_set_style_bg_opa(cloud_particles[i], opa, LV_PART_MAIN);
            }
            return;
          }

          // IDLE: slow movement at 320 ms intervals. This is the only other
          // continuously animated state.
          if ((id(jarvis_frame) % 2U) != 0U) {
            return;
          }

          id(jarvis_phase) += 0.035f;
          const float p = id(jarvis_phase);
          const float slow = (sinf(p * 1.35f) + 1.0f) * 0.5f;

          const int rot_outer_a = wrap360(18.0f + p * 7.9f);
          const int rot_outer_b = wrap360(151.0f - p * 5.8f);
          const int rot_outer_c = wrap360(276.0f + p * 3.6f);
          lv_arc_set_rotation(id(jarvis_outer_a), rot_outer_a);
          lv_arc_set_rotation(id(jarvis_outer_b), rot_outer_b);
          lv_arc_set_rotation(id(jarvis_outer_c), rot_outer_c);
          lv_arc_set_rotation(id(jarvis_outer_glow_a), rot_outer_a);
          lv_arc_set_rotation(id(jarvis_outer_glow_b), rot_outer_b);
          lv_arc_set_rotation(id(jarvis_outer_glow_c), rot_outer_c);
          lv_arc_set_rotation(id(jarvis_mid_a), wrap360(42.0f - p * 13.6f));
          lv_arc_set_rotation(id(jarvis_mid_b), wrap360(224.0f + p * 10.8f));
          lv_arc_set_rotation(id(jarvis_inner_a), wrap360(8.0f + p * 18.0f));
          lv_arc_set_rotation(id(jarvis_inner_b), wrap360(188.0f - p * 15.8f));

          const uint8_t segment_opa = 112 + (uint8_t)(slow * 42.0f);
          const uint8_t glow_opa = 28 + (uint8_t)(slow * 30.0f);
          for (auto *obj : segments) {
            lv_obj_set_style_arc_color(obj, lv_color_hex(0x00EAF7), LV_PART_MAIN);
            lv_obj_set_style_arc_opa(obj, segment_opa, LV_PART_MAIN);
          }
          lv_obj_set_style_arc_color(id(jarvis_mid_b), lv_color_hex(0x35AFFF), LV_PART_MAIN);
          lv_obj_set_style_arc_color(id(jarvis_inner_a), lv_color_hex(0xF8FFFF), LV_PART_MAIN);
          for (auto *obj : outer_glows) {
            lv_obj_set_style_arc_color(obj, lv_color_hex(0x00EAF7), LV_PART_MAIN);
            lv_obj_set_style_arc_opa(obj, glow_opa, LV_PART_MAIN);
          }
          lv_obj_set_style_arc_color(id(jarvis_halo), lv_color_hex(0x00EAF7), LV_PART_MAIN);
          lv_obj_set_style_arc_opa(id(jarvis_halo), 24 + (uint8_t)(slow * 34.0f), LV_PART_MAIN);

          // FULL ANIMATION PROFILE: wake-word detection is disabled, so the
          // complete idle visual set can run without competing for microphone CPU.
          for (int i = 0; i < 36; i++) {
            const float ripple = (sinf(p * 4.2f - i * 0.61f) + 1.0f) * 0.5f;
            const float shimmer = (float)((i * 29 + id(jarvis_frame) * 7) % 100) / 100.0f;
            lv_obj_set_style_bg_color(
                cloud_particles[i],
                (i % 5 == 0) ? lv_color_hex(0xF4FFFF) : lv_color_hex(0x00DDF5),
                LV_PART_MAIN);
            lv_obj_set_style_bg_opa(
                cloud_particles[i],
                5 + (uint8_t)(ripple * 34.0f + shimmer * 18.0f),
                LV_PART_MAIN);
          }

          // Eight asymmetric orbit points pulse in sequence.
          for (int i = 0; i < 8; i++) {
            float chase = (sinf(p * 3.0f - i * 0.92f) + 1.0f) * 0.5f;
            chase = chase * chase * chase;
            const uint8_t dot_opa = 10 + (uint8_t)(chase * 205.0f);
            const uint8_t glow_opa = 6 + (uint8_t)(chase * 120.0f);
            lv_obj_set_style_bg_color(listen_glows[i], lv_color_hex(0x00EAF7), LV_PART_MAIN);
            lv_obj_set_style_shadow_color(listen_glows[i], lv_color_hex(0x00EAF7), LV_PART_MAIN);
            lv_obj_set_style_bg_opa(listen_glows[i], glow_opa / 3, LV_PART_MAIN);
            lv_obj_set_style_shadow_opa(listen_glows[i], glow_opa, LV_PART_MAIN);
            lv_obj_set_style_bg_color(listen_dots[i], lv_color_hex(0xF4FFFF), LV_PART_MAIN);
            lv_obj_set_style_bg_opa(listen_dots[i], dot_opa, LV_PART_MAIN);
          }

          // Thin outer mist filaments drift at different rates.
          const float mist_speed[6] = {0.52f, -0.37f, 0.29f, -0.44f, 0.21f, -0.31f};
          const int mist_base[6] = {8, 64, 132, 201, 267, 326};
          for (int i = 0; i < 6; i++) {
            const float haze = (sinf(p * (1.7f + i * 0.09f) - i * 0.91f) + 1.0f) * 0.5f;
            lv_arc_set_rotation(speaking_mist_arcs[i],
                                wrap360((float)mist_base[i] + p * mist_speed[i] * 10.0f));
            lv_obj_set_style_arc_color(
                speaking_mist_arcs[i],
                (i == 2 || i == 5) ? lv_color_hex(0xF4FFFF)
                                   : ((i % 2 == 0) ? lv_color_hex(0x00EAF7)
                                                   : lv_color_hex(0x35AFFF)),
                LV_PART_MAIN);
            lv_obj_set_style_arc_opa(
                speaking_mist_arcs[i], 8 + (uint8_t)(haze * 42.0f), LV_PART_MAIN);
          }

          // Slow expanding pulse rings.
          const lv_color_t idle_pulse_colors[3] = {
            lv_color_hex(0x00EAF7), lv_color_hex(0x35AFFF), lv_color_hex(0xF4FFFF)
          };
          for (int i = 0; i < 3; i++) {
            const float travel = fmodf(p * 0.16f + i * 0.333f, 1.0f);
            const int size = 184 + (int)(travel * 146.0f);
            const uint8_t opa = 5 + (uint8_t)(sinf(travel * PI_F) * 58.0f);
            lv_obj_set_size(pulse_objs[i], size, size);
            lv_obj_center(pulse_objs[i]);
            lv_obj_set_style_border_color(pulse_objs[i], idle_pulse_colors[i], LV_PART_MAIN);
            lv_obj_set_style_border_opa(pulse_objs[i], opa, LV_PART_MAIN);
          }

          // Domino and fine-tick rings counter-rotate and breathe.
          const int domino_rotation = wrap360(p * 8.0f);
          const int ticks_rotation = wrap360(-p * 4.5f);
          lv_obj_set_style_transform_pivot_x(id(jarvis_domino_ring), lv_pct(50), LV_PART_MAIN);
          lv_obj_set_style_transform_pivot_y(id(jarvis_domino_ring), lv_pct(50), LV_PART_MAIN);
          lv_obj_set_style_transform_rotation(id(jarvis_domino_ring), domino_rotation * 10, LV_PART_MAIN);
          lv_obj_set_style_transform_pivot_x(id(jarvis_ticks), lv_pct(50), LV_PART_MAIN);
          lv_obj_set_style_transform_pivot_y(id(jarvis_ticks), lv_pct(50), LV_PART_MAIN);
          lv_obj_set_style_transform_rotation(id(jarvis_ticks), ticks_rotation * 10, LV_PART_MAIN);
          lv_obj_set_style_opa(id(jarvis_domino_ring), 155 + (uint8_t)(slow * 80.0f), LV_PART_MAIN);
          lv_obj_set_style_opa(id(jarvis_ticks), 100 + (uint8_t)(slow * 55.0f), LV_PART_MAIN);

          for (int i = 0; i < 4; i++) {
            const float flare = (sinf(p * (1.7f + i * 0.16f) - i * 1.55f) + 1.0f) * 0.5f;
            const uint8_t opa = 12 + (uint8_t)(flare * 92.0f);
            lv_obj_set_style_bg_color(flares[i], lv_color_hex(0x00EAF7), LV_PART_MAIN);
            lv_obj_set_style_bg_opa(flares[i], opa, LV_PART_MAIN);
            lv_obj_set_style_shadow_color(flares[i], lv_color_hex(0x00EAF7), LV_PART_MAIN);
            lv_obj_set_style_shadow_opa(flares[i], opa, LV_PART_MAIN);
          }
  # Linux boot-status panel. In ANIM mode it scrolls for one minute, then
  # freezes on its last frame for 15 minutes. In VOICE mode it remains
  # visible but completely static. Active voice/audio, notifications, and
  # short HUD quiet periods also freeze the current frame without hiding it.
  - interval: 900ms
    then:
      - lambda: |-
          static uint16_t boot_index = 0;
          static bool boot_visible = false;
          static bool frame_rendered = false;
          static bool scrolling_phase = true;
          static uint32_t phase_started_ms = 0;
          static uint32_t external_pause_started_ms = 0;
          static uint8_t command_pause_ticks = 0;
          static uint8_t lines_until_command_pause = 6;
          static bool row_failed[20] = {false};

          static const char *messages[] = {
            "STARTING SYSTEM LOGGER",
            "REACHED TARGET BASIC SYSTEM",
            "MOUNTED /BOOT",
            "LOADING KERNEL MODULES",
            "STARTED DEVICE EVENT MANAGER",
            "CHECKING FILE SYSTEM /DEV/ROOT",
            "INITIALIZING PPA ACCELERATOR",
            "SETTING HOSTNAME M5STACK-TAB5-V2",
            "STARTED HOME ASSISTANT API LINK",
            "WAITING FOR ESP32-C6 HOSTED WIFI",
            "CONFIGURED I2S AUDIO CLOCK",
            "CREATED LVGL DISPLAY BUFFER",
            "STARTED SPEAKER MEDIA PIPELINE",
            "INITIALIZED GT911 TOUCH CONTROLLER",
            "RESTORED USER INTERFACE STATE",
            "STARTING NETWORK TIME SYNCHRONIZATION",
            "REACHED TARGET SOUND CARD",
            "LOADED ES8388 AUDIO CODEC",
            "PROBED EXTERNAL PSRAM 32MB",
            "STARTED DISPLAY BACKLIGHT SERVICE",
            "APPLYING POWER MANAGEMENT PROFILE",
            "LINKED MIPI DSI DISPLAY",
            "STARTED VOICE PIPELINE MANAGER",
            "MOUNTED TEMPORARY FILE SYSTEM",
            "STARTED TOUCH INPUT SERVICE",
            "CHECKING BATTERY MONITOR",
            "CONNECTED HOME AUTOMATION BUS",
            "STARTED JARVIS VISUAL CORE",
            "RESTORED DASHBOARD PREFERENCES",
            "WAITING FOR USER INPUT",
            "SCANNING I2C DEVICES",
            "LOADED WEATHER DATA PROVIDER",
            "STARTED ORACLE MARKET FEED",
            "INITIALIZED TRAVEL POSTER CACHE",
            "STARTED APPLIANCE STATUS WATCHER",
            "CONFIGURED LIGHT CONTROL LINKS",
            "LOADED TERMINATOR FONT CACHE",
            "INITIALIZED WAKE PROFILE SWITCH",
            "STARTED WALLPAPER COMPOSITOR",
            "REACHED TARGET GRAPHICAL INTERFACE"
          };
          constexpr uint16_t message_count = sizeof(messages) / sizeof(messages[0]);
          constexpr uint8_t visible_lines = 20;

          auto render_terminal_frame = [&]() {
            char buffer[2048];
            size_t used = 0;
            buffer[0] = '\0';

            for (uint8_t row = 0; row < visible_lines; row++) {
              const char *message = messages[(boot_index + row) % message_count];
              const char *status = row_failed[row]
                  ? "#FF4A4A [FAIL]#"
                  : "#39FF70 [ OK ]#";
              const int written = snprintf(
                  buffer + used,
                  sizeof(buffer) - used,
                  row == visible_lines - 1 ? "%s %s" : "%s %s\n",
                  status,
                  message);
              if (written <= 0 || (size_t) written >= sizeof(buffer) - used) break;
              used += (size_t) written;
            }

            lv_label_set_text(id(linux_boot_label), buffer);
            frame_rendered = true;
          };

          const bool anim_profile = !id(voice_wake_enabled);
          const bool jarvis_idle = id(jarvis_mode) == 0;
          const bool effects_allowed = anim_profile &&
                                       jarvis_idle &&
                                       !id(jarvis_audio_freeze);
          const bool externally_paused = !effects_allowed ||
                                         id(notification_active) ||
                                         ((int32_t)(millis() - id(ui_quiet_until)) < 0);
          const uint32_t now_ms = millis();

          // The terminal is part of both profiles. VOICE simply freezes the
          // current frame rather than hiding the panel.
          if (!boot_visible) {
            lv_obj_clear_flag(id(linux_boot_box), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(linux_boot_label), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_recolor(id(linux_boot_label), true);
            boot_visible = true;
          }

          if (externally_paused) {
            // On a first boot directly into VOICE mode there is no previous
            // ANIM frame, so draw one frame once before freezing it.
            if (!frame_rendered) {
              render_terminal_frame();
            }

            // Leave the current terminal frame visible and stop the phase
            // clock. This prevents terminal redraws from making the
            // notification overlay or voice UI look jerky.
            if (external_pause_started_ms == 0) {
              external_pause_started_ms = now_ms;
            }
            return;
          }

          if (external_pause_started_ms != 0) {
            // Shift the phase start forward by the time spent paused, so a
            // notification, VOICE profile, or voice interaction does not
            // shorten the one-minute scroll or 15-minute frozen period.
            if (phase_started_ms != 0) {
              phase_started_ms += now_ms - external_pause_started_ms;
            }
            external_pause_started_ms = 0;
          }

          if (phase_started_ms == 0) {
            phase_started_ms = now_ms;
          }

          const uint32_t phase_duration_ms = scrolling_phase
              ? 60000UL    // one minute of scrolling
              : 900000UL;  // 15 minutes frozen

          if ((uint32_t)(now_ms - phase_started_ms) >= phase_duration_ms) {
            scrolling_phase = !scrolling_phase;
            phase_started_ms = now_ms;
            command_pause_ticks = 0;
            lines_until_command_pause = 4 + (esp_random() % 6);
            // Keep the final frame visible when entering the frozen phase.
            // When the next scrolling phase starts, the first new line is
            // rendered on the following 900 ms interval.
            return;
          }

          if (!scrolling_phase) {
            return;
          }

          // Within the active one-minute burst, occasionally hold the
          // current frame for about 1.8-2.7 seconds to mimic a slower command.
          if (command_pause_ticks > 0) {
            command_pause_ticks--;
            return;
          }

          render_terminal_frame();

          // Shift the status history with the text. A failure remains rare.
          for (uint8_t row = 0; row < visible_lines - 1; row++) {
            row_failed[row] = row_failed[row + 1];
          }
          row_failed[visible_lines - 1] = (esp_random() % 320U) == 0U;
          boot_index = (boot_index + 1) % message_count;

          if (--lines_until_command_pause == 0) {
            command_pause_ticks = 1 + (esp_random() % 2);
            lines_until_command_pause = 4 + (esp_random() % 6);
          }

  # Travel poster rotation.
  - interval: 5minutes
    then:
      - lambda: |-
          if (id(jarvis_audio_freeze) || id(mww).is_running() || id(notification_active) ||
              ((int32_t)(millis() - id(ui_quiet_until)) < 0)) {
            return;
          }
          // Pick a random image
          const lv_img_dsc_t* imgs[] = {
            id(rio).get_lv_image_dsc(),
            id(los_angeles).get_lv_image_dsc(),
            id(san_diego).get_lv_image_dsc(),
            id(seville).get_lv_image_dsc(),
            id(venice).get_lv_image_dsc(),
            id(tenerife).get_lv_image_dsc(),
            id(bangkok).get_lv_image_dsc(),
            id(lima).get_lv_image_dsc(),
            id(santiago).get_lv_image_dsc(),
            id(marrakech).get_lv_image_dsc()
          };
          const char* img_names[] = {
            "rio", "los_angeles", "san_diego", 
            "seville", "venice", "tenerife", "bangkok", "lima", 
            "santiago", "marrakech"
          };
          
          int num_images = 10;  
          int r = esp_random() % num_images;
          
          ESP_LOGD("travel", "Changing to image %d: %s", r, img_names[r]);

          // A poster source change is one of the larger LVGL redraws. Pause
          // the periodic HUD for a short window around it.
          id(ui_quiet_until) = millis() + 300UL;
          lv_img_set_src(id(travel_img), imgs[r]);

  # Compact segmented house-power bar. The filled segments progress from
  # green through yellow and orange to red as demand rises.
  - interval: 2s
    then:
      - lambda: |-
          if (id(jarvis_audio_freeze) || id(mww).is_running() || id(notification_active) ||
              ((int32_t)(millis() - id(ui_quiet_until)) < 0)) {
            return;
          }
          float p = id(current_house_power);
          if (isnan(p) || p < 0.0f) p = 0.0f;

          // Ten segments cover 0-5 kW in 500 W steps.
          int bars = (int) ceilf(p / 500.0f);
          if (bars > 10) bars = 10;
          if (bars < 0) bars = 0;

          // Do not restyle all ten segments when the displayed level has not
          // changed since the previous pass.
          static int last_bars = -1;
          if (bars == last_bars) {
            return;
          }
          last_bars = bars;
          id(ui_quiet_until) = millis() + 180UL;

          lv_obj_t *segments[] = {
            id(power_bar_1), id(power_bar_2), id(power_bar_3), id(power_bar_4), id(power_bar_5),
            id(power_bar_6), id(power_bar_7), id(power_bar_8), id(power_bar_9), id(power_bar_10)
          };

          const lv_color_t segment_colors[] = {
            lv_color_hex(0x43D17A), lv_color_hex(0x43D17A), lv_color_hex(0x43D17A),
            lv_color_hex(0xD8E34A), lv_color_hex(0xD8E34A), lv_color_hex(0xD8E34A),
            lv_color_hex(0xFF9F32), lv_color_hex(0xFF9F32),
            lv_color_hex(0xF04D4D), lv_color_hex(0xF04D4D)
          };

          for (int i = 0; i < 10; i++) {
            if (i < bars) {
              lv_obj_set_style_bg_color(segments[i], segment_colors[i], LV_PART_MAIN);
              lv_obj_set_style_bg_opa(segments[i], LV_OPA_COVER, LV_PART_MAIN);
              lv_obj_set_style_shadow_color(segments[i], segment_colors[i], LV_PART_MAIN);
              lv_obj_set_style_shadow_opa(segments[i], 90, LV_PART_MAIN);
            } else {
              lv_obj_set_style_bg_color(segments[i], lv_color_hex(0x17343A), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(segments[i], 115, LV_PART_MAIN);
              lv_obj_set_style_shadow_opa(segments[i], LV_OPA_TRANSP, LV_PART_MAIN);
            }
          }




