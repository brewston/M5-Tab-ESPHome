switch:
  - platform: gpio
    id: wifi_power
    name: "WiFi Power"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: usb_5v_power
    name: "USB Power"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 3
  - platform: gpio
    id: quick_charge
    name: "Quick Charge"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 5
      inverted: true
  - platform: gpio
    id: charge_enable
    name: "Charge Enable"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 7

  - platform: gpio
    id: wifi_antenna_int_ext
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 0
  - platform: gpio
    id: speaker_enable
    name: "Speaker Enable"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 1
    # Start muted; on_boot enables the amplifier after the codec is ready.
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: external_5v_power
    name: "External 5V Power"
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 2

  # Wake Word Sound Switch.
  - platform: template
    id: wake_sound
    name: Wake sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

 # Even with backlight off, you can apparently get burn in. This prevents it, but runs as night (when backlight is off, so you don't see it)   See later for the nighttime schedule.

  - platform: template
    name: Antiburn
    id: switch_antiburn
    icon: mdi:television-shimmer
    optimistic: true
    entity_category: "config"
    turn_on_action:
      - logger.log: "Starting Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - lvgl.pause:
          show_snow: true
    turn_off_action:
      - logger.log: "Stopping Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
binary_sensor: #Some sensors from HA, not using the TV one at the moment.

  - platform: homeassistant
    id: wm_needs_emptying
    entity_id: ${ha_washing_machine_needs_emptying}
    on_state:
      - script.execute: refresh_ha_widgets

  # Remote light states keep the LVGL buttons synchronised with Home Assistant.
  - platform: homeassistant
    id: wled_light_state
    entity_id: ${ha_light_wled}
    trigger_on_initial_state: true
    on_state:
      - lvgl.widget.update:
          id: wled_toggle_btn
          state:
            checked: !lambda return x;

  - platform: homeassistant
    id: smart_bulb_light_state
    entity_id: ${ha_light_smart_bulb}
