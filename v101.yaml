# v98: Clean substitutions and centralise every Home Assistant entity ID.
# v89: Move Hive, conditional Boiler, and all active appliances onto one compact top row above the temperature meter.
# v91: Widen the main heating/appliance panel and give the washing-machine timer more room.
# v97: Nudge all three health rows down for more even vertical spacing.
# v96: Use a bed icon for the sleep health metric.
# v95: Add daily steps as the third health metric and remove the SYS 01 footer label to make room.
# v94: Reuse the ORCL panel for morning health stats (sleep + energy), switching to ORCL during market hours.
# v87: Put the indoor-temperature meter on its own full-width row below Boiler/Hive, matching the broadband/power meter style.
# v86: Replace the indoor thermometer/value with a 15-33 C segmented room-temperature meter.
# v82: Remove washing-machine timer suffix and force the remaining-time digits onto one line.
# v81: Compact the person locator by grouping all home portraits behind one shared home icon.
# v80: Lower the listening waveform slightly for better clearance below the Jarvis orb.
# v79: Lower the notification strip to clear the lowest Jarvis arc.
# v78: Keep the on-screen HUD version label tied to a single version substitution.
# v77: Keep the Linux code panel visible as a static frame whenever VOICE mode is active.
# v76: Reveal the Linux code panel immediately whenever ANIM mode is active.
# v75: Use a cart for Big Tesco, Morrisons, and Sainsburys; basket for other shopping zones.
# v74: Increase clearance around the central orb for the listening label and waveform.
# v73: Split the listening status around the central Jarvis orb.
# v72: Extend the notification left and place LISTENING inside the inner Jarvis arc.
# v71: Widen and left-shift the notification; return LISTENING to the lower HUD area.
# v70: Move the Home Assistant notification directly above the person locator card.
# v69: Restore degree symbols as separate Roboto labels and keep them aligned after temperature updates.
# v68: Add faint heating/power/appliance sub-panels and fix temperature degree-symbol spacing.
# v67: Shift the person locator right and align its portrait/icon tiles with the ORCL panel baseline.
# v66: Centre the listening/profile controls on Jarvis and enlarge person location icons to portrait size.
# v65: Widen the person locator with side-by-side location icons; raise notification/listening; remove footer branding.
# v64: Enlarge and move the person locator beside ORCL; remove the ORCL circuit route.
# v63: Remove the Linux-panel circuit route and add a four-person photo/location card.
# v62: Left-pack active appliance indicators while keeping the washing-machine icon and timer grouped.
# v61: Raise the power row, move appliances into the heating panel, enlarge it for person cards, and lower weather/ORCL.
# v59: Reduce weather and ORCL panel heights to better match their contents.
# v58: Tighten boiler/Hive/thermometer row and move the house-power meter up with its heading.
# v56: Fix ORCL local-variable shadowing in the batched Home Assistant refresh lambda.
# v54: Freeze Linux boot text and all periodic HUD/background animation while notifications are visible.
# v36: light controls moved to LVGL top layer for reliable touch; pendant first with wider spacing.
# v35: original.jpeg boot splash with backlight held off; light toggles restored to proven on_press actions.
# v34: appliance strip lowered again; three large simple top-right light toggle buttons; color popup removed.
# v43: two selectable idle profiles: full animation with wake word disabled, or static idle with wake word enabled; WM minutes use Terminator Small.
# v20 wallpaper edition: cleaned original.jpeg used as the LVGL display background.
# v31: static while microWakeWord runs; equal four-row panel spacing; lightweight thinking only.
# v30: gentle wake-word-safe idle ring motion; static listening/speaking/error; lightweight thinking; larger power icon.
# v26: freezes all HUD animation while Voice Assistant or speaker audio is active.
# v25: strengthens static wave/star accents, narrows the shopping panel, and lowers the poster.
# v24: hides both meter pivot dots and places the shopping panel beside the left circuit bus.
# v20: freezes all HUD animation during listening/STT and moves the shopping panel closer to the Home Assistant icon.
# Based on v19 watermark and circuit layout.
# Based on the working v18 layout and audio configuration.
# Keeps the proven wake-word microphone/speaker handoff.
# v16: wider left panels, shopping-cart icon, and lower notification placement.
# Date format: FRI 31 JUL (no year).

# My M5 Tab5 code, heavily based on https://github.com/GinAndBacon/m5stack-m5tab-lvgl-esphome - huge kudos to the author for doing all the hard work :)


substitutions:
